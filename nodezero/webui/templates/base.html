<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}nodezero-lite reports{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <h1><a href="{{ url_for('index') }}">nodezero-lite</a></h1>
    <p class="tagline">Saved engagement reports &mdash; read-only viewer</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>
      This page only reads JSON report files already written by
      <code>nodezero run</code>. It cannot start a scan or change scope.
    </p>
  </footer>
</body>
</html>
